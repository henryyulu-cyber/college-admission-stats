{{define "content"}}
<!-- 主頁面容器 -->
<div class="space-y-6">
    <!-- 頁面標題與操作控制列 -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-6 shadow-sm">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
                <h2 class="text-xl font-extrabold text-white tracking-tight flex items-center gap-2">
                    <span class="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg">📊</span>
                    學群與系所深度分析中心
                </h2>
                <p class="text-xs text-slate-400 mt-1">深度解析 18 大學群內部系所人數分佈佔比與生源高中流向</p>
            </div>

            <!-- HTMX 篩選表單 -->
            <form id="disciplines-form" class="flex flex-wrap items-center gap-2.5"
                  hx-get="/disciplines"
                  hx-target="#disciplines-content"
                  hx-swap="outerHTML">
                
                <!-- 18 大學群選擇下拉選單 -->
                <div class="relative">
                    <label class="text-[11px] text-slate-400 mr-1">學群：</label>
                    <select name="group" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 cursor-pointer" onchange="document.getElementById('disciplines-form').dispatchEvent(new Event('submit'))">
                        {{range .Options.Groups}}
                        <option value="{{.}}" {{if eq $.SelectedGroup .}}selected{{end}}>{{.}}</option>
                        {{end}}
                    </select>
                </div>

                <!-- 學年度篩選下拉選單 -->
                <div class="relative">
                    <label class="text-[11px] text-slate-400 mr-1">學年：</label>
                    <select name="year" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 cursor-pointer" onchange="document.getElementById('disciplines-form').dispatchEvent(new Event('submit'))">
                        <option value="0" {{if eq .SelectedYear 0}}selected{{end}}>全部學年度 (110~115)</option>
                        {{range .Options.Years}}
                        <option value="{{.}}" {{if eq $.SelectedYear .}}selected{{end}}>{{.}} 學年度</option>
                        {{end}}
                    </select>
                </div>

                <!-- 學系下鑽篩選下拉選單 -->
                <div class="relative">
                    <label class="text-[11px] text-slate-400 mr-1">學系下鑽：</label>
                    <select name="dept" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500 cursor-pointer max-w-[200px]" onchange="document.getElementById('disciplines-form').dispatchEvent(new Event('submit'))">
                        <option value="" {{if eq .SelectedDept ""}}selected{{end}}>全部學系 (學群總覽)</option>
                        {{range .Departments}}
                        <option value="{{.}}" {{if eq $.SelectedDept .}}selected{{end}}>{{.}}</option>
                        {{end}}
                    </select>
                </div>
            </form>
        </div>
    </div>

    <!-- 局部置換內容容器 -->
    {{template "disciplines_partial.html" .}}
</div>
{{end}}
